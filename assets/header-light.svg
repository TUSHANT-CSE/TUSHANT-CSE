<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Tushant — code, catch, create</title>
  <desc id="desc">A glossy Pokéball-inspired energy sphere floats beside animated electric, leaf and fire creature silhouettes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFF"/>
      <stop offset=".36" stop-color="#F5F0FF"/>
      <stop offset=".68" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#FFF9F3"/>
    </linearGradient>
    <radialGradient id="nebula" cx=".76" cy=".48" r=".55">
      <stop stop-color="#22D3EE" stop-opacity=".13"/>
      <stop offset=".34" stop-color="#8B5CF6" stop-opacity=".12"/>
      <stop offset=".67" stop-color="#FF4D8D" stop-opacity=".1"/>
      <stop offset="1" stop-color="#F8FAFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2=".4">
      <stop stop-color="#111827"/>
      <stop offset=".48" stop-color="#7C2D78"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#EC4899"/>
      <stop offset=".45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0891B2"/>
      <stop offset=".33" stop-color="#6366F1"/>
      <stop offset=".66" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="topBall" cx=".35" cy=".18" r=".9">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".16" stop-color="#FFE6F4"/>
      <stop offset=".47" stop-color="#FF6B93"/>
      <stop offset=".82" stop-color="#E93573"/>
      <stop offset="1" stop-color="#BE185D"/>
    </radialGradient>
    <radialGradient id="bottomBall" cx=".35" cy=".72" r=".82">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E0F7FF"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </radialGradient>
    <radialGradient id="center" cx=".33" cy=".25" r=".8">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".42" stop-color="#17243A"/>
      <stop offset="1" stop-color="#050916"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop stop-color="#8B5CF6" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#22D3EE" stop-opacity=".12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8CF5B5"/>
      <stop offset="1" stop-color="#1C9B73"/>
    </linearGradient>
    <linearGradient id="electric" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF08A"/>
      <stop offset="1" stop-color="#FF9E1B"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2=".5" y2="0">
      <stop stop-color="#FF4D4D"/>
      <stop offset=".55" stop-color="#FF8A24"/>
      <stop offset="1" stop-color="#FFE36B"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#475569" flood-opacity=".22"/>
    </filter>
    <filter id="ballShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0891B2" flood-opacity=".2"/>
    </filter>
    <clipPath id="ballClip"><circle cx="1320" cy="260" r="142"/></clipPath>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1E293B" stroke-opacity=".035"/>
    </pattern>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
      .scene{transform-origin:1320px 260px;animation:float 6s ease-in-out infinite}
      .buddy{transform-box:fill-box;transform-origin:center;animation:buddy 4.8s ease-in-out infinite}
      .buddy.leaf{animation-delay:-1.6s}.buddy.flame{animation-delay:-3.2s}
      .spin{transform-origin:1320px 260px;animation:spin 26s linear infinite}
      .spin-fast{transform-origin:1320px 260px;animation:spin 15s linear infinite reverse}
      .comet{offset-path:path('M 1135 260 C 1135 100 1490 72 1520 250 C 1548 418 1355 452 1198 350 C 1068 262 1160 152 1250 155');animation:comet 11s linear infinite}
      .spark{transform-box:fill-box;transform-origin:center;animation:spark 3s ease-in-out infinite}
      .spark.two{animation-delay:.8s}.spark.three{animation-delay:1.6s}
      .shine{animation:shine 5s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
      @keyframes buddy{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes comet{to{offset-distance:100%}}
      @keyframes shine{0%,100%{opacity:.18}50%{opacity:.48}}
      @keyframes spark{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
      @media(prefers-reduced-motion:reduce){.scene,.buddy,.spin,.spin-fast,.comet,.spark,.shine{animation:none}.comet{offset-distance:32%}.spark{opacity:.8}}
    </style>
  </defs>
  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="30" fill="url(#grid)"/>
  <rect width="1600" height="520" rx="30" fill="url(#nebula)"/>
  <ellipse cx="1320" cy="260" rx="390" ry="310" fill="url(#glow)"/>
  <g opacity=".65">
    <path d="M0 405C210 354 336 443 527 409S790 350 971 396" fill="none" stroke="#0891B2" stroke-opacity=".1" stroke-width="2"/>
    <path d="M0 434C196 396 356 469 547 438S806 386 1000 421" fill="none" stroke="#8B5CF6" stroke-opacity=".1" stroke-width="2"/>
  </g>
  <g transform="translate(92 80)">
    <text x="0" y="24" fill="#BE185D" font-size="15" font-weight="700" letter-spacing="5" class="mono">CODE / CATCH / CREATE</text>
    <text x="-5" y="153" fill="url(#title)" font-size="122" font-weight="800" letter-spacing="-6" class="sans">TUSHANT</text>
    <rect x="0" y="188" width="64" height="5" rx="3" fill="url(#accent)"/>
    <text x="84" y="198" fill="#0E7490" font-size="20" font-weight="600" letter-spacing="1.3" class="mono">BACKEND ENGINEER + CREATIVE DEVELOPER</text>
    <text x="0" y="270" fill="#334155" font-size="24" class="sans">Building reliable systems. Catching clever ideas.</text>
    <text x="0" y="306" fill="#64748B" font-size="16" class="mono">INDIA / COMPUTER SCIENCE / ALWAYS LEVELING UP</text>
    <g transform="translate(0 347)">
      <rect width="207" height="36" rx="18" fill="#EC4899" fill-opacity=".08" stroke="#EC4899" stroke-opacity=".22"/>
      <circle cx="20" cy="18" r="4" fill="#EC4899"/>
      <text x="34" y="23" fill="#BE185D" font-size="12" letter-spacing="1.5" class="mono">BUILD. LEARN. EVOLVE.</text>
    </g>
  </g>
  <g fill="none" stroke="url(#orbit)">
    <g class="spin">
      <ellipse cx="1320" cy="260" rx="245" ry="153" transform="rotate(-22 1320 260)" stroke-width="2" opacity=".7"/>
      <circle cx="1320" cy="107" r="7" fill="#0891B2" stroke="#ECFEFF" stroke-width="2"/>
      <circle cx="1542" cy="313" r="6" fill="#F43F5E" stroke="#FFF1F2" stroke-width="1.5"/>
      <circle cx="1220" cy="407" r="5" fill="#D97706" stroke="#FFFBEB" stroke-width="1.5"/>
    </g>
    <g class="spin-fast">
      <ellipse cx="1320" cy="260" rx="202" ry="202" stroke-width="1.5" stroke-dasharray="4 10" opacity=".55"/>
      <circle cx="1320" cy="58" r="5" fill="#8B5CF6" stroke="#F5F3FF" stroke-width="1.5"/>
      <circle cx="1522" cy="260" r="5" fill="#D97706"/>
    </g>
    <ellipse cx="1320" cy="260" rx="168" ry="168" stroke-width="1" opacity=".22"/>
  </g>
  <circle class="comet" r="5" fill="#0891B2" filter="url(#softGlow)"/>
  <g class="scene">
    <g transform="translate(1320 260) rotate(8)" filter="url(#shadow)">
      <circle r="146" fill="#FF4D8D" fill-opacity=".12" filter="url(#softGlow)"/>
      <circle r="142" fill="url(#topBall)"/>
      <path d="M-142 0A142 142 0 0 0 142 0Z" fill="url(#bottomBall)"/>
      <g clip-path="url(#ballClip)">
        <path d="M-145-12C-68-38 62-44 147-12L147 10C62-21-62-16-145 10Z" fill="#111B31"/>
        <path d="M-142 0H142" stroke="#F8FCFF" stroke-opacity=".7" stroke-width="2"/>
        <ellipse cx="-60" cy="-68" rx="55" ry="24" transform="rotate(-28 -60 -68)" fill="#FFFFFF" fill-opacity=".26" class="shine"/>
        <ellipse cx="58" cy="82" rx="62" ry="17" transform="rotate(-17 58 82)" fill="#FFFFFF" fill-opacity=".2"/>
      </g>
      <circle r="142" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3"/>
      <circle r="45" fill="#0D1729" stroke="#F4FAFF" stroke-width="8"/>
      <circle r="30" fill="url(#center)" stroke="#8B5CF6" stroke-opacity=".5" stroke-width="2" filter="url(#ballShadow)"/>
      <path d="M-13 0H-3L4-14 13 15 22 1H34" fill="none" stroke="#0891B2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="103" cy="-74" r="5" fill="#FFFFFF" fill-opacity=".8"/>
    </g>
    <g transform="translate(1180 120) rotate(-12)" filter="url(#shadow)">
      <g class="buddy electric">
        <path d="M-22 25C-28 6-16-8 0-9L-7-30 12-14 31-26 25-4C43 6 44 28 29 40L25 59H-24L-27 39C-42 34-47 20-43 10L-59 17-49-2-60-13-39-10-41-23Z" fill="url(#electric)" stroke="#FFE88A" stroke-width="2"/>
        <circle cx="-10" cy="13" r="4" fill="#172139"/><circle cx="17" cy="13" r="4" fill="#172139"/>
        <circle cx="5" cy="24" r="4" fill="#E65358"/><path d="M-4 32Q5 38 14 32" fill="none" stroke="#8B4C2B" stroke-width="2" stroke-linecap="round"/>
        <circle cx="-27" cy="28" r="8" fill="#FF5B63" opacity=".9"/>
        <path d="M-18-18L-12-34-5-17 4-39 9-15 19-33 20-11Z" fill="url(#electric)" stroke="#FFF29A" stroke-width="2"/>
        <path d="M-45 17L-57 7M41 12L55 0M-33-7L-46-16" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
    <g transform="translate(1480 369) rotate(12)" filter="url(#shadow)">
      <g class="buddy leaf">
        <path d="M-26 37C-45 22-39-9-17-20C-25-42-1-58 13-40C28-55 48-37 40-17C60 1 47 31 28 40L27 60H-22L-24 42C-38 48-48 51-58 46C-48 35-40 32-26 37Z" fill="#58B98B" stroke="#B7F6C7" stroke-width="2"/>
        <path d="M-14-18C-30-36-6-51 9-42C20-51 39-34 28-18Z" fill="url(#leaf)"/>
        <path d="M-4-42L-8-63 4-49 11-67 16-43Z" fill="#71D98E"/>
        <ellipse cx="-11" cy="7" rx="5" ry="8" fill="#F8FFFF"/><ellipse cx="18" cy="7" rx="5" ry="8" fill="#F8FFFF"/>
        <circle cx="-9" cy="9" r="2.5" fill="#9E274E"/><circle cx="20" cy="9" r="2.5" fill="#9E274E"/>
        <path d="M-4 25Q6 33 16 24" fill="none" stroke="#214E49" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M-36 35L-58 28-48 45Z" fill="#76D89B"/>
      </g>
    </g>
    <g transform="translate(1398 78) scale(.62)" filter="url(#shadow)">
      <g class="buddy flame">
        <path d="M-30 41C-51 28-43 0-22-12C-39-35-12-59 4-37C21-58 47-35 31-12C57 4 44 36 22 44L20 65H-19L-21 45C-36 51-47 52-58 47L-45 29-58 18-40 16-44 0-27 3Z" fill="url(#flame)" stroke="#FFD27A" stroke-width="3"/>
        <ellipse cx="-12" cy="10" rx="5" ry="8" fill="#FFF7D6"/><ellipse cx="17" cy="10" rx="5" ry="8" fill="#FFF7D6"/>
        <circle cx="-10" cy="12" r="2.5" fill="#442055"/><circle cx="19" cy="12" r="2.5" fill="#442055"/>
        <path d="M-4 29Q6 37 16 28" fill="none" stroke="#8C2B34" stroke-width="3" stroke-linecap="round"/>
        <path d="M-3-31C-8-49 7-53 13-68C17-51 30-47 24-30 15-39 6-37-3-31Z" fill="#FFE36B"/>
      </g>
    </g>
  </g>
  <g filter="url(#softGlow)">
    <circle class="spark" cx="1098" cy="184" r="6" fill="#0891B2"/>
    <circle class="spark two" cx="1518" cy="183" r="5" fill="#F43F5E"/>
    <circle class="spark three" cx="1160" cy="404" r="5" fill="#D97706"/>
  </g>
  <path d="M1070 437C1165 478 1460 471 1545 427" fill="none" stroke="#0891B2" stroke-opacity=".14" stroke-width="18" filter="url(#softGlow)"/>
  <text x="1500" y="478" text-anchor="end" fill="#64748B" font-size="12" letter-spacing="2" class="mono">NEXT ADVENTURE / READY</text>
  <rect x="1" y="1" width="1598" height="518" rx="29" fill="none" stroke="#0F172A" stroke-opacity=".1"/>
</svg>
