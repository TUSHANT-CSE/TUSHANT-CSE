<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Tushant — Backend engineer and creative developer</title>
  <desc id="desc">Animated teal and violet signal paths orbit the text Backend engineer and creative developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F3F8"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141922"/>
      <stop offset="1" stop-color="#30394A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#638C13"/>
      <stop offset="1" stop-color="#118575"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7964DB" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#7964DB" stop-opacity=".12"/>
      <stop offset="1" stop-color="#638C13" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7964DB" stop-opacity=".1"/>
      <stop offset="1" stop-color="#7964DB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#334155" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .draw{stroke-dasharray:540;stroke-dashoffset:540;animation:draw 6s ease-in-out infinite}
      .satellite{offset-path:path('M 1070 208 C 1180 60 1430 80 1500 235 C 1560 370 1400 385 1300 315 C 1180 225 1090 370 1120 330');animation:orbit 18s linear infinite}
      @keyframes draw{0%,15%{stroke-dashoffset:540}55%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-540}}
      @keyframes pulse{0%,100%{opacity:.55;r:4}50%{opacity:1;r:6}}
      @keyframes orbit{to{offset-distance:100%}}
      @media(prefers-reduced-motion:reduce){.pulse,.draw,.satellite{animation:none}.draw{stroke-dashoffset:0}.satellite{offset-distance:34%}}
    </style>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="28" fill="url(#grid)"/>
  <ellipse cx="1340" cy="210" rx="420" ry="300" fill="url(#glow)"/>
  <g transform="translate(90 64)">
    <text x="0" y="35" fill="#4E6F20" font-size="15" font-weight="700" letter-spacing="5" class="mono">SYSTEMS / INTERFACES / IDEAS</text>
    <text x="-4" y="142" fill="url(#text)" font-size="116" font-weight="750" letter-spacing="-6" class="sans">TUSHANT</text>
    <rect x="0" y="176" width="54" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="73" y="185" fill="#6951BF" font-size="20" font-weight="500" letter-spacing="1.5" class="mono">BACKEND ENGINEER + CREATIVE DEVELOPER</text>
    <text x="0" y="255" fill="#526077" font-size="23" class="sans">Reliable systems. Thoughtful interfaces. Real results.</text>
    <text x="0" y="302" fill="#78869B" font-size="16" class="mono">INDIA / COMPUTER SCIENCE / OPEN TO BUILD &amp; LEARN</text>
  </g>
  <g fill="none" stroke="url(#orbit)">
    <path d="M1070 208C1180 60 1430 80 1500 235C1560 370 1400 385 1300 315C1180 225 1090 370 1120 330" stroke-width="1.5" opacity=".35" class="draw"/>
    <ellipse cx="1330" cy="210" rx="175" ry="102" transform="rotate(-22 1330 210)" stroke-width="1.5" opacity=".5"/>
    <ellipse cx="1330" cy="210" rx="124" ry="124" stroke-width="1" stroke-dasharray="3 8" opacity=".3"/>
    <ellipse cx="1330" cy="210" rx="72" ry="72" stroke-width="1" opacity=".2"/>
  </g>
  <circle cx="1330" cy="210" r="44" fill="#638C13" fill-opacity=".05" stroke="#638C13" stroke-opacity=".18"/>
  <path d="M1300 210h15l8-19 13 40 10-21h16" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="pulse" cx="1330" cy="210" r="6" fill="#638C13"/>
  <circle class="satellite" r="5" fill="#638C13"/>
  <g fill="#7964DB">
    <circle cx="1171" cy="137" r="3" opacity=".8"/>
    <circle cx="1460" cy="289" r="3" opacity=".8"/>
    <circle cx="1490" cy="167" r="2" opacity=".6"/>
    <circle cx="1232" cy="301" r="2" opacity=".6"/>
  </g>
  <text x="1500" y="382" text-anchor="end" fill="#78869B" font-size="12" letter-spacing="2" class="mono">SIGNAL / ACTIVE</text>
  <rect x="1" y="1" width="1598" height="418" rx="27" fill="none" stroke="#334155" stroke-opacity=".08"/>
</svg>
