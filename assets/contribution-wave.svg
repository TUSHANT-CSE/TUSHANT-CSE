<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="200" viewBox="0 0 1400 200" role="img" aria-labelledby="title desc">
  <title id="title">Build, learn, refine, repeat</title>
  <desc id="desc">An abstract animated signal, not actual contribution data. Seven days of a contribution grid lead into a continuously drawing lime wave.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0C1020"/>
      <stop offset="1" stop-color="#1A1230"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset=".28" stop-color="#818CF8"/>
      <stop offset=".58" stop-color="#FF5EA8"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="17" height="17" rx="4" fill="#FFFFFF" fill-opacity=".025"/>
    </pattern>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .trace{stroke-dasharray:1120;stroke-dashoffset:1120;animation:trace 6s ease-in-out infinite}
      .beacon{animation:beacon 3s ease-in-out infinite}
      .cell{animation:cell 3s ease-in-out infinite}
      @keyframes trace{0%,10%{stroke-dashoffset:1120}62%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-1120}}
      @keyframes beacon{0%,100%{opacity:.35;r:3}50%{opacity:1;r:5}}
      @keyframes cell{0%,100%{opacity:.3}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.trace{animation:none;stroke-dashoffset:0}.beacon,.cell{animation:none;opacity:1}}
    </style>
  </defs>
  <rect width="1400" height="200" rx="24" fill="url(#background)"/>
  <rect width="1400" height="200" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1398" height="198" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>
  <text x="38" y="43" fill="#FF77C8" font-size="12" letter-spacing="2.5" class="mono">THE FEEDBACK LOOP</text>
  <text x="38" y="158" fill="#778399" font-size="11" class="mono">BUILD → LEARN → REFINE → REPEAT</text>
  <g transform="translate(42 65)">
    <rect class="cell" x="0" y="0" width="15" height="15" rx="3" fill="#22D3EE"/>
    <rect class="cell" style="animation-delay:.4s" x="21" y="0" width="15" height="15" rx="3" fill="#818CF8" opacity=".85"/>
    <rect class="cell" style="animation-delay:.8s" x="21" y="21" width="15" height="15" rx="3" fill="#FF5EA8" opacity=".7"/>
    <rect class="cell" style="animation-delay:1.2s" x="21" y="42" width="15" height="15" rx="3" fill="#818CF8" opacity=".55"/>
    <rect class="cell" style="animation-delay:1.6s" x="42" y="42" width="15" height="15" rx="3" fill="#FBBF24" opacity=".75"/>
    <rect class="cell" style="animation-delay:2s" x="63" y="42" width="15" height="15" rx="3" fill="#FF5EA8" opacity=".65"/>
    <rect class="cell" style="animation-delay:2.4s" x="63" y="21" width="15" height="15" rx="3" fill="#22D3EE" opacity=".5"/>
    <rect class="cell" style="animation-delay:2.8s" x="84" y="21" width="15" height="15" rx="3" fill="#FBBF24" opacity=".8"/>
  </g>
  <path d="M170 124C225 124 245 52 304 74C365 96 354 150 413 125C472 100 482 47 541 77C600 107 589 158 648 129C707 100 717 38 776 65C835 92 834 151 893 122C952 93 960 64 1019 83C1078 102 1080 151 1139 123C1198 95 1218 68 1276 87C1310 98 1330 100 1360 92" fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path class="trace" d="M170 124C225 124 245 52 304 74C365 96 354 150 413 125C472 100 482 47 541 77C600 107 589 158 648 129C707 100 717 38 776 65C835 92 834 151 893 122C952 93 960 64 1019 83C1078 102 1080 151 1139 123C1198 95 1218 68 1276 87C1310 98 1330 100 1360 92" fill="none" stroke="#FFF0FA" stroke-opacity=".9" stroke-width="1.5" stroke-linecap="round"/>
  <circle class="beacon" cx="893" cy="122" r="4" fill="#FF5EA8"/>
  <text x="1345" y="43" text-anchor="end" fill="#778399" font-size="11" letter-spacing="1.5" class="mono">ABSTRACT SIGNAL / NOT LIVE DATA</text>
</svg>
